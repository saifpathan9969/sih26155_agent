# GAACA Dataset — Fortinet FortiAP — SECURE — Sample 10
config wireless-controller vap
    edit "Corp-VAP"
        set ssid "Corp-WiFi"
        set security wpa3-enterprise
        set pmf mandatory
        set intra-vap-privacy enable
        set schedule "always"
    next
end
config wireless-controller wtp-profile
    edit "FAP431F-SECURE"
        set ap-country US
    next
end
