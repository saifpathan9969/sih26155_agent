# GAACA Dataset — Huawei VRP Switch — SECURE — Sample 2
sysname PROD-CLOUDENGINES5700/S6700-BER-64
#
stp mode rstp
stp bpdu-protection
#
dhcp enable
dhcp snooping enable
#
vlan 2912
 description Workstation-VLAN
#
interface GigabitEthernet0/0/1
 port link-type access
 port default vlan 2912
 stp edged-port enable
 port-security enable
 port-security max-mac-num 2
 port-security protect-action shutdown
 dhcp snooping check dhcp-chaddr enable
#
undo telnet server enable
stelnet server enable
#
local-user admin password irreversible-cipher REDACTED_ADMIN_PASS
local-user admin service-type stelnet
local-user admin level 15
#
info-center loghost 198.51.100.10
ntp-service unicast-server 203.0.113.123
#
return
