! GAACA Dataset — Cisco NX-OS Switch — SECURE — Sample 8
version 10.2(3)
hostname DMZ-NEXUS9300SWITCH-SFO-41
feature lacp
feature vpc
feature lldp
no feature telnet
no feature http-server
!
spanning-tree mode mst
spanning-tree port type edge bpduguard default
!
vlan 2210
  name Leaf-VLAN
!
interface Ethernet1/1
  switchport mode access
  switchport access vlan 2210
  spanning-tree port type edge
  storm-control broadcast level 5.0
  no shutdown
!
interface Ethernet1/48
  switchport mode trunk
  switchport trunk allowed vlan 2210
  no shutdown
!
