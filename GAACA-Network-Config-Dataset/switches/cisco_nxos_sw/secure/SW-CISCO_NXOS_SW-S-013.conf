! GAACA Dataset — Cisco NX-OS Switch — SECURE — Sample 13
version 10.2(3)
hostname DIST-NEXUS9300SWITCH-SYD-80
feature lacp
feature vpc
feature lldp
no feature telnet
no feature http-server
!
spanning-tree mode mst
spanning-tree port type edge bpduguard default
!
vlan 3734
  name Leaf-VLAN
!
interface Ethernet1/1
  switchport mode access
  switchport access vlan 3734
  spanning-tree port type edge
  storm-control broadcast level 5.0
  no shutdown
!
interface Ethernet1/48
  switchport mode trunk
  switchport trunk allowed vlan 3734
  no shutdown
!
