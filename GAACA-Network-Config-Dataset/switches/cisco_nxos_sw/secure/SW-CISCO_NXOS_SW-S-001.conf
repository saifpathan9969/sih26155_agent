! GAACA Dataset — Cisco NX-OS Switch — SECURE — Sample 1
version 10.2(3)
hostname HQ-NEXUS9300SWITCH-SEA-79
feature lacp
feature vpc
feature lldp
no feature telnet
no feature http-server
!
spanning-tree mode mst
spanning-tree port type edge bpduguard default
!
vlan 1252
  name Leaf-VLAN
!
interface Ethernet1/1
  switchport mode access
  switchport access vlan 1252
  spanning-tree port type edge
  storm-control broadcast level 5.0
  no shutdown
!
interface Ethernet1/48
  switchport mode trunk
  switchport trunk allowed vlan 1252
  no shutdown
!
username admin role network-admin password 5 T3st_P@ssw0rd_Lab!
logging server 203.0.113.50 6
ntp server 192.0.2.123
