! GAACA Dataset — Cisco NX-OS Switch — SECURE — Sample 19
version 10.2(3)
hostname PROD-NEXUS9300SWITCH-MUM-15
feature lacp
feature vpc
feature lldp
no feature telnet
no feature http-server
!
spanning-tree mode mst
spanning-tree port type edge bpduguard default
!
vlan 2201
  name Leaf-VLAN
!
interface Ethernet1/1
  switchport mode access
  switchport access vlan 2201
  spanning-tree port type edge
  storm-control broadcast level 5.0
  no shutdown
!
interface Ethernet1/48
  switchport mode trunk
  switchport trunk allowed vlan 2201
  no shutdown
!
username admin role network-admin password 5 P@ssw0rd_PLACEHOLDER
logging server 198.51.100.11 6
ntp server 203.0.113.123
