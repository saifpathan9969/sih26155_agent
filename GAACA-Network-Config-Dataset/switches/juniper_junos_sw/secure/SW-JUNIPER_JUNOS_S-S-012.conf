/* GAACA Dataset — Juniper EX Switch — SECURE — Sample 12 */
system {
    host-name DIST-EX4300/EX4400SWITCH-AMS-63;
    root-authentication {
        encrypted-password "REDACTED_ADMIN_PASS";
    }
    services {
        ssh {
            protocol-version v2;
        }
    }
    syslog {
        host 198.51.100.11 {
            any notice;
        }
    }
    ntp {
        server 198.51.100.123;
    }
}
interfaces {
    ge-0/0/0 {
        unit 0 {
            family ethernet-switching {
                interface-mode access;
                vlan {
                    members 2078;
                }
                storm-control default;
            }
        }
    }
}
forwarding-options {
    storm-control-profiles default {
        all {
            bandwidth-percentage 20;
        }
    }
    dhcp-security {
        group access-ports {
            interface ge-0/0/0.0;
        }
        group trusted-uplinks {
            overrides {
                trusted;
            }
            interface ge-0/0/23.0;
        }
    }
}
protocols {
    rstp {
        bpdu-block-on-edge;
        interface ge-0/0/0 {
            edge;
        }
    }
}
vlans {
    vlan-2078 {
        vlan-id 2078;
    }
}
