/* GAACA Dataset — Juniper EX Switch — SECURE — Sample 20 */
system {
    host-name CAMPUS-EX4300/EX4400SWITCH-AMS-11;
    root-authentication {
        encrypted-password "P@ssw0rd_PLACEHOLDER";
    }
    services {
        ssh {
            protocol-version v2;
        }
    }
    syslog {
        host 203.0.113.50 {
            any notice;
        }
    }
    ntp {
        server 192.0.2.123;
    }
}
interfaces {
    ge-0/0/0 {
        unit 0 {
            family ethernet-switching {
                interface-mode access;
                vlan {
                    members 2784;
                }
                storm-control default;
            }
        }
    }
}
forwarding-options {
    storm-control-profiles default {
        all {
            bandwidth-percentage 20;
        }
    }
    dhcp-security {
        group access-ports {
            interface ge-0/0/0.0;
        }
        group trusted-uplinks {
            overrides {
                trusted;
            }
            interface ge-0/0/23.0;
        }
    }
}
protocols {
    rstp {
        bpdu-block-on-edge;
        interface ge-0/0/0 {
            edge;
        }
    }
}
vlans {
    vlan-2784 {
        vlan-id 2784;
    }
}
