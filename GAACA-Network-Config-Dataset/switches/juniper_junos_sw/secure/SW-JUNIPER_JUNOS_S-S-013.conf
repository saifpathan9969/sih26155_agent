/* GAACA Dataset — Juniper EX Switch — SECURE — Sample 13 */
system {
    host-name DIST-EX4300/EX4400SWITCH-SYD-80;
    root-authentication {
        encrypted-password "T3st_P@ssw0rd_Lab!";
    }
    services {
        ssh {
            protocol-version v2;
        }
    }
    syslog {
        host 198.51.100.11 {
            any notice;
        }
    }
    ntp {
        server 192.0.2.123;
    }
}
interfaces {
    ge-0/0/0 {
        unit 0 {
            family ethernet-switching {
                interface-mode access;
                vlan {
                    members 3734;
                }
                storm-control default;
            }
        }
    }
}
forwarding-options {
    storm-control-profiles default {
        all {
            bandwidth-percentage 20;
        }
    }
    dhcp-security {
        group access-ports {
            interface ge-0/0/0.0;
        }
        group trusted-uplinks {
            overrides {
                trusted;
            }
            interface ge-0/0/23.0;
        }
    }
}
protocols {
    rstp {
        bpdu-block-on-edge;
        interface ge-0/0/0 {
            edge;
        }
    }
}
vlans {
    vlan-3734 {
        vlan-id 3734;
    }
}
