! GAACA Dataset — Ruijie Switch — SECURE — Sample 12
hostname DIST-RG-SSERIESMANAGEDSWITCH-AMS-63
service password-encryption
enable secret REDACTED_ADMIN_PASS
no telnet-server enable
ssh-server enable
spanning-tree
spanning-tree bpduguard default
vlan 2078
interface GigabitEthernet 0/1
 switchport mode access
 switchport access vlan 2078
 switchport port-security
