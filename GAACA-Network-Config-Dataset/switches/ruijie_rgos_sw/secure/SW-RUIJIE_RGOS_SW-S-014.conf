! GAACA Dataset — Ruijie Switch — SECURE — Sample 14
hostname BR-RG-SSERIESMANAGEDSWITCH-DAL-71
service password-encryption
enable secret REDACTED_ADMIN_PASS
no telnet-server enable
ssh-server enable
spanning-tree
spanning-tree bpduguard default
vlan 2491
interface GigabitEthernet 0/1
