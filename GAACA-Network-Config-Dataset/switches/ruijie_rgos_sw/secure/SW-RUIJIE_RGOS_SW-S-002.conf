! GAACA Dataset — Ruijie Switch — SECURE — Sample 2
hostname PROD-RG-SSERIESMANAGEDSWITCH-BER-64
service password-encryption
enable secret REDACTED_ADMIN_PASS
no telnet-server enable
ssh-server enable
spanning-tree
spanning-tree bpduguard default
vlan 2912
interface GigabitEthernet 0/1
 switchport mode access
 switchport access vlan 2912
 switchport port-security
 switchport port-security violation shutdown
logging server 198.51.100.10
ntp server 203.0.113.123
line vty 0 4
 transport input ssh
