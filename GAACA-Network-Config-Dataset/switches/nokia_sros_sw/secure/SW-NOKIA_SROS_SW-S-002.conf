# GAACA Dataset — Nokia SAS Switch — SECURE — Sample 2
configure system name "PROD-7210SASETHERNETSWITCH-BER-64"
configure system security telnet-server shutdown
configure system security ssh server-shutdown no
configure system security user "admin" password "REDACTED_ADMIN_PASS"
configure service
    vpls 2912 customer 1 create
        stp
            shutdown
        exit
        sap 1/1/1 create
            ingress
                qos 1
            exit
            no shutdown
        exit
        no shutdown
    exit
exit
configure log syslog 198.51.100.10 facility local7
configure system ntp server 203.0.113.123
