# GAACA Dataset — Nokia SAS Switch — SECURE — Sample 14
configure system name "BR-7210SASETHERNETSWITCH-DAL-71"
configure system security telnet-server shutdown
configure system security ssh server-shutdown no
configure system security user "admin" password "REDACTED_ADMIN_PASS"
configure service
    vpls 2491 customer 1 create
        stp
            shutdown
        exit
        sap 1/1/1 create
            ingress
                qos 1
            exit
            no shutdown
        exit
        no shutdown
    exit
exit
configure log syslog 198.51.100.11 facility local7
configure system ntp server 198.51.100.123
