# GAACA Dataset — Extreme EXOS Switch — SECURE — Sample 1
configure snmp sysName "HQ-SUMMITX440/X460SWITCH-SEA-79"
disable telnet
enable ssh2
configure account admin encrypted "T3st_P@ssw0rd_Lab!"
create vlan "ClientVlan"
configure vlan "ClientVlan" tag 1252
configure vlan "ClientVlan" add ports 1:1 untagged
enable stpd s0
