# GAACA Dataset — Extreme EXOS Switch — SECURE — Sample 14
configure snmp sysName "BR-SUMMITX440/X460SWITCH-DAL-71"
disable telnet
enable ssh2
configure account admin encrypted "REDACTED_ADMIN_PASS"
create vlan "ClientVlan"
configure vlan "ClientVlan" tag 2491
configure vlan "ClientVlan" add ports 1:1 untagged
enable stpd s0
configure stpd s0 ports edge 1:1
configure stpd s0 ports bpdu-restrict 1:1 enable
enable elrp-client
configure elrp-client periodic "ClientVlan" ports 1:1 interval 1 log and-trap
configure syslog add 198.51.100.11:514 vr VR-Default local0 notice
configure sntp-client add server 198.51.100.123 vr VR-Default
enable sntp-client
