! GAACA Dataset — Cisco Catalyst Switch — SECURE — Sample 3
version 17.6
service password-encryption
hostname LAB-CATALYST9300/3850-BER-46
!
spanning-tree mode rapid-pvst
spanning-tree portfast default
spanning-tree portfast bpduguard default
spanning-tree extend system-id
!
ip dhcp snooping
ip dhcp snooping vlan 1166
no ip dhcp snooping information option
ip arp inspection vlan 1166
!
vlan 1166
 name Corporate-Data
!
vlan 999
 name Blackhole-Unused
!
interface GigabitEthernet1/0/1
 description Access-Workstation
 switchport mode access
 switchport access vlan 1166
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation shutdown
 switchport port-security mac-address sticky
 storm-control broadcast level 10.0
 storm-control action shutdown
 spanning-tree bpduguard enable
 no shutdown
!
interface GigabitEthernet1/0/24
 description Core-Trunk-Uplink
 switchport mode trunk
 switchport trunk allowed vlan 1166,999
 switchport nonegotiate
 ip dhcp snooping trust
 ip arp inspection trust
 no shutdown
!
interface range GigabitEthernet1/0/2 - 23
 switchport mode access
 switchport access vlan 999
 shutdown
!
username secadmin privilege 15 secret S3cur3_D3m0_P@ss!
ip ssh version 2
no ip http server
ip http secure-server
logging host 198.51.100.11
ntp server 198.51.100.123
!
line vty 0 4
 transport input ssh
 exec-timeout 5 0
!
end
