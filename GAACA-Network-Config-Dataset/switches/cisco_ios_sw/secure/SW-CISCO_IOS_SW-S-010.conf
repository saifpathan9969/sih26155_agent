! GAACA Dataset — Cisco Catalyst Switch — SECURE — Sample 10
version 17.6
service password-encryption
hostname DIST-CATALYST9300/3850-SIN-19
!
spanning-tree mode rapid-pvst
spanning-tree portfast default
spanning-tree portfast bpduguard default
spanning-tree extend system-id
!
ip dhcp snooping
ip dhcp snooping vlan 131
no ip dhcp snooping information option
ip arp inspection vlan 131
!
vlan 131
 name Corporate-Data
!
vlan 999
