! GAACA Dataset — Cisco ASA — SECURE — Sample 1
! Generated for SIH26155 compliance auditor training
!
hostname HQ-ASA-SEA-79
domain-name example.lab
!
enable password T3st_P@ssw0rd_Lab! encrypted
passwd T3st_P@ssw0rd_Lab! encrypted
!
interface GigabitEthernet0/0
 nameif outside
 security-level 0
 ip address 198.51.100.195 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/1
 nameif inside
 security-level 100
 ip address 198.51.100.90 255.255.255.0
 no shutdown
!
interface GigabitEthernet0/2
 nameif dmz
 security-level 50
 ip address 203.0.113.236 255.255.255.0
 no shutdown
!
interface Management0/0
 nameif management
 security-level 100
 ip address 192.0.2.135 255.255.255.0
 management-only
 no shutdown
!
! --- SSH Hardening ---
ssh version 2
ssh key-exchange group dh-group14-sha256
ssh timeout 5
ssh 192.0.2.156 255.255.255.255 management
ssh 198.51.100.214 255.255.255.0 inside
no ssh outside
!
! --- Telnet Disabled ---
no telnet inside
no telnet outside
no telnet management
!
! --- HTTP/HTTPS Management ---
no http server enable
http server enable 8443
http 192.0.2.135 255.255.255.0 management
ssl server-version tlsv1.2
ssl cipher tlsv1.2 custom "AES256-SHA256:DHE-RSA-AES256-SHA256"
!
! --- Authentication / AAA ---
aaa-server RADIUS-SVR protocol radius
aaa-server RADIUS-SVR (management) host 203.0.113.20
 key REDACTED_PSK_0123456789abcdef
 authentication-port 1812
 accounting-port 1813
 timeout 5
 retry-interval 3
!
aaa authentication ssh console RADIUS-SVR LOCAL
aaa authentication http console RADIUS-SVR LOCAL
aaa authentication enable console RADIUS-SVR LOCAL
aaa accounting command RADIUS-SVR
aaa accounting connection RADIUS-SVR
!
username admin password T3st_P@ssw0rd_Lab! encrypted privilege 15
username admin attributes
 service-type admin
!
! --- Password Policy ---
password-policy minimum-length 14
password-policy minimum-uppercase 1
password-policy minimum-lowercase 1
password-policy minimum-numeric 1
password-policy minimum-special 1
password-policy lifetime 90
!
! --- Login Attempt Lockout ---
aaa local authentication attempts max-fail 3
!
! --- SNMP v3 Only ---
no snmp-server enable
snmp-server group SNMPV3GRP v3 priv
snmp-server user snmpv3admin SNMPV3GRP v3 auth sha T3st_P@ssw0rd_Lab! priv aes 256 T3st_P@ssw0rd_Lab!
snmp-server host management 203.0.113.50 trap version 3 snmpv3admin
!
! --- Logging ---
logging enable
logging timestamp
logging buffer-size 1048576
logging buffered informational
logging trap informational
logging host management 203.0.113.50
logging asdm informational
logging facility 20
!
! --- NTP ---
ntp authenticate
ntp authentication-key 1 md5 LAB_IPSEC_PSK_fedcba9876543210
ntp trusted-key 1
ntp server 192.0.2.123 key 1 prefer
!
! --- DNS ---
dns domain-lookup outside
dns server-group DefaultDNS
 name-server 203.0.113.53
!
! --- Access Control (Default Deny) ---
access-list OUTSIDE-IN extended deny ip any any log
access-group OUTSIDE-IN in interface outside
!
access-list INSIDE-OUT extended permit tcp 203.0.113.126 255.255.255.0 any eq 443
access-list INSIDE-OUT extended permit tcp 192.0.2.81 255.255.255.0 any eq 80
access-list INSIDE-OUT extended permit udp 203.0.113.4 255.255.255.0 any eq 53
access-list INSIDE-OUT extended deny ip any any log
access-group INSIDE-OUT in interface inside
!
! --- Banner ---
banner login WARNING: Authorized users only. All activity is monitored and logged.
!
! --- Console Timeout ---
console timeout 5
!
! --- Unused Services Disabled ---
no service dhcp
no service call-home
!
! --- Threat Detection ---
threat-detection basic-threat
threat-detection statistics access-list
threat-detection statistics tcp-intercept rate-interval 30 burst-rate 400 average-rate 200
!
end
