! GAACA Dataset — Cisco ASA — EDGE CASE — Sample 3
! Conflicting access rules
hostname EDGE-ASA-CHI-44
!
access-list OUTSIDE-IN extended permit tcp any host 198.51.100.153 eq 443
access-list OUTSIDE-IN extended deny tcp any host 192.0.2.56 eq 443
access-list OUTSIDE-IN extended permit ip any any
access-list OUTSIDE-IN extended deny ip any any log
access-group OUTSIDE-IN in interface outside
!
! SSH enabled but also telnet
ssh version 2
ssh 198.51.100.189 255.255.255.0 management
telnet 203.0.113.254 255.255.255.0 inside
!
! SNMP v3 configured but v2 community also set
snmp-server group SNMPV3GRP v3 priv
snmp-server community public
!
end
