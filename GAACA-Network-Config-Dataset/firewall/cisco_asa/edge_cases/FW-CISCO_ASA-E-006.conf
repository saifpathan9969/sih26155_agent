! GAACA Dataset — Cisco ASA — EDGE CASE — Sample 6
! Conflicting access rules
hostname REMOTE-ASA-DAL-93
!
access-list OUTSIDE-IN extended permit tcp any host 203.0.113.117 eq 443
access-list OUTSIDE-IN extended deny tcp any host 203.0.113.215 eq 443
access-list OUTSIDE-IN extended permit ip any any
access-list OUTSIDE-IN extended deny ip any any log
access-group OUTSIDE-IN in interface outside
!
! SSH enabled but also telnet
ssh version 2
ssh 203.0.113.126 255.255.255.0 management
telnet 192.0.2.212 255.255.255.0 inside
!
! SNMP v3 configured but v2 community also set
snmp-server group SNMPV3GRP v3 priv
snmp-server community public
!
end
