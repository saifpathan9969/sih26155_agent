! GAACA Dataset — Cisco ASA — EDGE CASE — Sample 9
! Conflicting access rules
hostname PROD-ASA-FRA-20
!
access-list OUTSIDE-IN extended permit tcp any host 198.51.100.84 eq 443
access-list OUTSIDE-IN extended deny tcp any host 198.51.100.153 eq 443
access-list OUTSIDE-IN extended permit ip any any
access-list OUTSIDE-IN extended deny ip any any log
access-group OUTSIDE-IN in interface outside
!
! SSH enabled but also telnet
ssh version 2
ssh 198.51.100.84 255.255.255.0 management
telnet 203.0.113.249 255.255.255.0 inside
!
! SNMP v3 configured but v2 community also set
snmp-server group SNMPV3GRP v3 priv
snmp-server community public
!
end
