! GAACA Dataset — Cisco ASA — MISCONFIGURED — Sample 20
!
hostname LAB-ASA-CHI-98
!
enable password cisco
passwd cisco
!
interface GigabitEthernet0/0
 nameif outside
 security-level 0
 ip address 198.51.100.214 255.255.255.252
 no shutdown
!
interface GigabitEthernet0/1
 nameif inside
 security-level 100
 ip address 192.0.2.168 255.255.255.0
 no shutdown
!
! --- INSECURE: Telnet enabled ---
telnet 198.51.100.148 255.255.255.0 inside
telnet timeout 30
!
! --- INSECURE: SSH v1 allowed ---
ssh version 1
ssh 0.0.0.0 0.0.0.0 outside
ssh timeout 60
!
! --- INSECURE: HTTP management enabled (no HTTPS) ---
http server enable
http 0.0.0.0 0.0.0.0 inside
http 0.0.0.0 0.0.0.0 outside
!
! --- INSECURE: No AAA, local only with weak password ---
username admin password admin privilege 15
!
! --- INSECURE: SNMP v2c with default community ---
snmp-server enable
snmp-server community public
snmp-server community private
snmp-server host inside 203.0.113.69 community public version 2c
!
! --- INSECURE: No logging ---
no logging enable
!
! --- INSECURE: No NTP ---
no ntp server
!
! --- INSECURE: Any-Any permit ---
access-list OUTSIDE-IN extended permit ip any any
access-group OUTSIDE-IN in interface outside
!
access-list INSIDE-OUT extended permit ip any any
access-group INSIDE-OUT in interface inside
!
! --- No banner ---
!
! --- No console timeout ---
console timeout 0
!
end
