# GAACA Dataset — Ubiquiti EdgeRouter — MISCONFIGURED — Sample 1
set system host-name WAN-EDGEROUTER-DXB-09
set interfaces ethernet eth0 address 192.0.2.252/30
set interfaces ethernet eth1 address 192.0.2.102/24
set service ssh protocol-version v1
set service telnet port 23
set service gui listen-address 0.0.0.0
set system login user admin authentication plaintext-password admin
# No firewall rules
# No syslog
# No NTP
