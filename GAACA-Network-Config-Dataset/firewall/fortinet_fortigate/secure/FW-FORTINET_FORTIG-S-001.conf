# GAACA Dataset — FortiGate — SECURE — Sample 1
config system global
    set hostname "HQ-FORTIGATE-SEA-79"
    set timezone 04
    set admin-sport 8443
    set admin-ssh-port 22
    set admintimeout 10
    set admin-ssh-v1 disable
    set admin-telnet disable
    set admin-https-ssl-versions tlsv1-2 tlsv1-3
    set strong-crypto enable
    set admin-lockout-threshold 3
    set admin-lockout-duration 300
    set pre-login-banner enable
    set post-login-banner enable
end

config system interface
    edit "port1"
        set vdom "root"
        set mode static
        set ip 192.0.2.135 255.255.255.252
        set allowaccess ping
        set description "WAN-Uplink"
        set role wan
    next
    edit "port2"
        set vdom "root"
        set mode static
        set ip 198.51.100.195 255.255.255.0
        set allowaccess ping https ssh
        set description "LAN-Internal"
        set role lan
    next
    edit "port3"
        set vdom "root"
        set mode static
        set ip 198.51.100.90 255.255.255.0
        set allowaccess ping
        set description "DMZ"
        set role dmz
    next
    edit "mgmt"
        set vdom "root"
        set mode static
        set ip 203.0.113.236 255.255.255.0
        set allowaccess https ssh
        set description "Management"
        set dedicated-to management
    next
end

config system admin
    edit "admin"
        set accprofile "super_admin"
        set password T3st_P@ssw0rd_Lab!
        set force-password-change enable
        set two-factor fortitoken
        set trusthost1 192.0.2.156 255.255.255.0
    next
end

config system password-policy
    set status enable
    set min-length 14
    set min-upper-case-letter 1
    set min-lower-case-letter 1
    set min-number 1
    set min-non-alphanumeric 1
    set expire-status enable
    set expire-day 90
    set reuse-password disable
end

config user radius
    edit "RADIUS-PRIMARY"
        set server "203.0.113.20"
        set secret DEMO_VPN_KEY_abcdef0123456789
        set radius-port 1812
        set acct-all-servers enable
    next
end

config system snmp sysinfo
    set status enable
    set description "HQ-FORTIGATE-SEA-79"
    set contact-info "security-team@example.lab"
    set location "Datacenter-A"
end

config system snmp community
    edit 1
        set name "DEMO_RO_COMMUNITY"
        set status disable
    next
end

config system snmp user
    edit "snmpv3admin"
        set security-level auth-priv
        set auth-proto sha256
        set auth-pwd T3st_P@ssw0rd_Lab!
        set priv-proto aes256
        set priv-pwd T3st_P@ssw0rd_Lab!
        set notify-hosts 203.0.113.50
    next
end

config log syslogd setting
    set status enable
    set server "203.0.113.50"
    set port 514
    set facility local7
    set source-ip 203.0.113.77
    set format default
    set enc-algorithm high
end

config log setting
    set fwpolicy-implicit-log enable
    set local-in-allow enable
    set local-in-deny-unicast enable
    set local-out enable
end

config system ntp
    set ntpsync enable
    set type custom
    set syncinterval 60
    config ntpserver
        edit 1
            set server "192.0.2.123"
            set ntpv3 enable
        next
    end
end

config firewall policy
    edit 1
        set name "LAN-to-WAN-Web"
        set srcintf "port2"
        set dstintf "port1"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "HTTPS" "DNS"
        set logtraffic all
        set utm-status enable
        set av-profile "default"
        set ips-sensor "default"
        set ssl-ssh-profile "deep-inspection"
    next
    edit 2
        set name "Default-Deny"
        set srcintf "any"
        set dstintf "any"
        set srcaddr "all"
        set dstaddr "all"
        set action deny
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
end

config system replacemsg admin "pre-login-disclaimer"
    set buffer "WARNING: Authorized access only. Activity is logged and monitored."
end
