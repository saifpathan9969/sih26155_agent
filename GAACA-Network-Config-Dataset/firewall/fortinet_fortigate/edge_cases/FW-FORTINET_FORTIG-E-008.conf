# GAACA Dataset — FortiGate — EDGE CASE — Sample 8
# Mixed security — some hardened, some not
config system global
    set hostname "CORE-FORTIGATE-AMS-98"
    set admin-ssh-v1 disable
    set admin-telnet enable
    set strong-crypto enable
    set admin-lockout-threshold 0
end

config log syslogd setting
    set status enable
    set server "198.51.100.10"
end

config system snmp community
    edit 1
        set name "public"
        set status enable
    next
end

config firewall policy
    edit 1
        set name "Allow-All-Temp"
        set srcintf "any"
        set dstintf "any"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
        set logtraffic all
    next
end
