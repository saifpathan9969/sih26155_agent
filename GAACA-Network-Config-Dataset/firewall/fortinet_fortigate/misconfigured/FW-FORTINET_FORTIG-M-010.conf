# GAACA Dataset — FortiGate — MISCONFIGURED — Sample 10
config system global
    set hostname "REMOTE-FORTIGATE-MUM-15"
    set admin-sport 443
    set admintimeout 0
    set admin-ssh-v1 enable
    set admin-telnet enable
    set admin-https-ssl-versions tlsv1-0 tlsv1-1 tlsv1-2
    set strong-crypto disable
    set admin-lockout-threshold 0
end

config system interface
    edit "port1"
        set vdom "root"
        set ip 192.0.2.170 255.255.255.252
        set allowaccess ping https ssh http telnet snmp
        set role wan
    next
    edit "port2"
        set vdom "root"
        set ip 203.0.113.208 255.255.255.0
        set allowaccess ping https ssh http telnet snmp fgfm
        set role lan
    next
end

config system admin
    edit "admin"
        set accprofile "super_admin"
        set password admin
    next
end

config system password-policy
    set status disable
end

config system snmp community
    edit 1
        set name "public"
        set status enable
        config hosts
            edit 1
                set ip 0.0.0.0 0.0.0.0
            next
        end
        set events cpu-high mem-low log-full
    next
    edit 2
        set name "private"
        set status enable
    next
end

config log syslogd setting
    set status disable
end

config log setting
    set fwpolicy-implicit-log disable
    set local-in-allow disable
    set local-in-deny-unicast disable
end

config system ntp
    set ntpsync disable
end

config firewall policy
    edit 1
        set name "Allow-All"
        set srcintf "any"
        set dstintf "any"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "ALL"
        set logtraffic disable
        set utm-status disable
    next
end
