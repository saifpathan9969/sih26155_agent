# GAACA Dataset — SonicWall — MISCONFIGURED — Sample 11
hostname BR-SONICWALL-CHI-47

interface X0
 ip 203.0.113.106 netmask 255.255.255.0
 zone LAN
 management https ssh http telnet snmp ping
 no shutdown

interface X1
 ip 198.51.100.105 netmask 255.255.255.252
 zone WAN
 management http
 no shutdown

administration
 web-management http
 telnet enable
 ssh timeout 0
 password-complexity disable
 admin-lockout disable

logging
 no syslog-server

snmp
 version v2c
 community public
 community private

access-rule
 from WAN to LAN action allow log disable
