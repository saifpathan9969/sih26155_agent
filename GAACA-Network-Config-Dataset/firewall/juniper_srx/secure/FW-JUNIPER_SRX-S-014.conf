set system services web-management session idle-timeout 10

set system login user admin class super-user
set system login user admin authentication encrypted-password "T3st_P@ssw0rd_Lab!"
set system login retry-options tries-before-disconnect 3
set system login retry-options backoff-threshold 1
set system login retry-options backoff-factor 6
set system login retry-options lockout-period 5
set system login retry-options minimum-time 30

set system authentication-order radius password
set system radius-server 198.51.100.20 secret "LAB_IPSEC_PSK_fedcba9876543210"
set system radius-server 198.51.100.20 timeout 5
set system radius-server 198.51.100.20 retry 3

set system syslog host 198.51.100.11 any info
set system syslog host 198.51.100.11 authorization any
set system syslog host 198.51.100.11 change-log any
set system syslog host 198.51.100.11 interactive-commands any
set system syslog file messages any info
set system syslog file messages authorization info
set system syslog file interactive-commands interactive-commands any
