# GAACA Dataset — Huawei USG — SECURE — Sample 20
sysname CAMPUS-USG-AMS-11
header login information "WARNING: Authorized access only. Activity is logged."

interface GigabitEthernet0/0/0
 ip address 203.0.113.174 255.255.255.252
 description WAN-Uplink
 undo shutdown

interface GigabitEthernet0/0/1
 ip address 198.51.100.14 255.255.255.0
 description LAN-Internal
 undo shutdown

interface GigabitEthernet0/0/2
 ip address 203.0.113.238 255.255.255.0
 description DMZ
 undo shutdown

firewall zone untrust
 add interface GigabitEthernet0/0/0

firewall zone trust
 add interface GigabitEthernet0/0/1

firewall zone dmz
 add interface GigabitEthernet0/0/2

stelnet server enable
ssh server-source -i GigabitEthernet0/0/1
ssh authentication-type default password
undo telnet server enable
undo telnet server-source all-interface

undo web-manager enable http
web-manager enable https
web-manager security ssl-version tlsv1.2

aaa
 authentication-scheme RADIUS-SCHEME
  authentication-mode radius local
 domain default
  authentication-scheme RADIUS-SCHEME
  radius-server RADIUS-TEMPLATE

radius-server template RADIUS-TEMPLATE
 radius-server authentication 203.0.113.20 1812
 radius-server shared-key cipher DEMO_VPN_KEY_abcdef0123456789
 radius-server retransmit 3
 radius-server timeout 5

local-user admin password irreversible-cipher REDACTED_ADMIN_PASS
local-user admin privilege level 3
local-user admin service-type terminal ssh

user-security-policy
 password complexity enable
 password min-length 14
 password expire 90
 login-failed-times 3
 login-failed-timer block-timer 5 block-time 300

info-center enable
info-center loghost 198.51.100.10 channel loghost
info-center source default channel loghost log level informational

ntp-service unicast-server 192.0.2.123
ntp-service authentication enable
ntp-service authentication-keyid 1 authentication-mode md5 cipher DEMO_VPN_KEY_abcdef0123456789
ntp-service reliable authentication-keyid 1

snmp-agent sys-info version v3
snmp-agent usm-user v3 snmpv3admin authentication-mode sha cipher T3st_P@ssw0rd_Lab! privacy-mode aes256 cipher REDACTED_ADMIN_PASS
undo snmp-agent sys-info version v1 v2c

security-policy
 rule name TRUST-TO-UNTRUST-WEB
  source-zone trust
  destination-zone untrust
  action permit
  service https dns
  logging enable
 rule name DEFAULT-DENY
  source-zone any
  destination-zone any
  action deny
  logging enable

return
