# GAACA Dataset — Huawei USG — MISCONFIGURED — Sample 20
sysname LAB-USG-CHI-98

interface GigabitEthernet0/0/0
 ip address 198.51.100.214 255.255.255.252
 undo shutdown

interface GigabitEthernet0/0/1
 ip address 192.0.2.168 255.255.255.0
 undo shutdown

telnet server enable
telnet server-source all-interface
web-manager enable http

local-user admin password simple admin123
local-user admin privilege level 3

user-security-policy
 password complexity disable
 password min-length 1

undo info-center enable
undo ntp-service unicast-server

snmp-agent sys-info version v2c
snmp-agent community read public
snmp-agent community write private

security-policy
 rule name ALLOW-ALL
  source-zone any
  destination-zone any
  action permit

return
