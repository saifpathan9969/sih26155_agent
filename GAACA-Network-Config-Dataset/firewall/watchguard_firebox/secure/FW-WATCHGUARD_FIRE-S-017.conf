# GAACA Dataset — WatchGuard Firebox — SECURE — Sample 17
policy-type firebox

system
  hostname CORE-FIREBOX-DXB-68
  contact security-team@example.lab
  location Datacenter-A
  login-banner "WARNING: Authorized access only. Activity is logged."

interface
  external eth0 ip 198.51.100.101/30
  trusted eth1 ip 198.51.100.224/24
  optional eth2 ip 198.51.100.96/24

management
  https-port 8080
  ssh enable
  ssh-port 22
  no telnet
  no http
  session-timeout 10
  admin-lockout attempts 3 duration 300
  password-policy min-length 14 complexity enable

logging
  syslog-server 198.51.100.11 port 514
  log-level info
  log-admin-actions enable
  log-connections enable
  log-denied enable

ntp-server primary 192.0.2.123
ntp-server secondary 198.51.100.123
ntp-enable

snmp
  version v3
  snmpv3-user admin auth sha256 priv aes256
  no v2c-community

policy
  rule 1 from trusted to external service HTTPS action allow log enable
  rule 2 from trusted to external service DNS action allow log enable
  rule 999 from any to any service any action deny log enable
