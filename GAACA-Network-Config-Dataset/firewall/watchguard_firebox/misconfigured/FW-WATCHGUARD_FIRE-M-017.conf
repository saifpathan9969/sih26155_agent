# GAACA Dataset — WatchGuard Firebox — MISCONFIGURED — Sample 17
system
  hostname WAN-FIREBOX-DAL-66

interface
  external eth0 ip 198.51.100.237/30
  trusted eth1 ip 203.0.113.192/24

management
  http enable
  telnet enable
  session-timeout 0
  password-policy min-length 1 complexity disable

logging
  no syslog-server

snmp
  version v2c
  community public read-only
  community private read-write

policy
  rule 1 from any to any service any action allow log disable
