# GAACA Dataset — WatchGuard Firebox — MISCONFIGURED — Sample 9
system
  hostname DIST-FIREBOX-PAR-74

interface
  external eth0 ip 203.0.113.223/30
  trusted eth1 ip 203.0.113.29/24

management
  http enable
  telnet enable
  session-timeout 0
  password-policy min-length 1 complexity disable

logging
  no syslog-server

snmp
  version v2c
  community public read-only
  community private read-write

policy
  rule 1 from any to any service any action allow log disable
