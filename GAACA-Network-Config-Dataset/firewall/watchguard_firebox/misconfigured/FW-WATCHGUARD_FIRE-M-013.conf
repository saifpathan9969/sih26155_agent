# GAACA Dataset — WatchGuard Firebox — MISCONFIGURED — Sample 13
system
  hostname ACCESS-FIREBOX-SFO-36

interface
  external eth0 ip 198.51.100.187/30
  trusted eth1 ip 203.0.113.241/24

management
  http enable
  telnet enable
  session-timeout 0
  password-policy min-length 1 complexity disable

logging
  no syslog-server

snmp
  version v2c
  community public read-only
  community private read-write

policy
  rule 1 from any to any service any action allow log disable
