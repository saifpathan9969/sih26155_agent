# GAACA Dataset — WatchGuard Firebox — MISCONFIGURED — Sample 1
system
  hostname WAN-FIREBOX-DXB-09

interface
  external eth0 ip 192.0.2.252/30
  trusted eth1 ip 192.0.2.102/24

management
  http enable
  telnet enable
  session-timeout 0
  password-policy min-length 1 complexity disable

logging
  no syslog-server

snmp
  version v2c
  community public read-only
  community private read-write

policy
  rule 1 from any to any service any action allow log disable
