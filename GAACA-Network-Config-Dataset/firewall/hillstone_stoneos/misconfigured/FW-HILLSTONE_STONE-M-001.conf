# GAACA Dataset — Hillstone StoneOS — MISCONFIGURED — Sample 1
hostname WAN-STONEOS-DXB-09
interface ethernet0/0 zone untrust ip address 192.0.2.252 255.255.255.252
interface ethernet0/1 zone trust ip address 192.0.2.102 255.255.255.0
admin service telnet enable
admin service http enable
admin lockout disable
admin password-policy min-length 1
syslog disable
ntp disable
snmp version v2c community public
policy id 1 from any to any service any action permit log disable
