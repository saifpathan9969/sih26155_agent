# GAACA Dataset — Hillstone StoneOS — SECURE — Sample 20
hostname CAMPUS-STONEOS-AMS-11

interface ethernet0/0
 zone untrust
 ip address 192.0.2.244 255.255.255.252

interface ethernet0/1
 zone trust
 ip address 203.0.113.134 255.255.255.0

interface ethernet0/2
 zone dmz
 ip address 203.0.113.65 255.255.255.0

admin-user admin password P@ssw0rd_PLACEHOLDER encrypted privilege admin
admin service ssh enable
admin service ssh version v2
admin service telnet disable
admin service http disable
admin service https enable port 4443
admin session-timeout 10
admin lockout enable max-attempts 3 duration 300
admin password-policy min-length 14

syslog host 203.0.113.50 port 514 facility local7
syslog level informational

ntp server 203.0.113.123 prefer
ntp enable

snmp version v3
snmp v3-user admin auth sha256 priv aes256

policy id 1
 name TRUST-TO-UNTRUST-WEB
 from trust to untrust
 service https dns
 action permit
 log enable

policy id 999
 name DEFAULT-DENY
 from any to any
 service any
 action deny
 log enable
