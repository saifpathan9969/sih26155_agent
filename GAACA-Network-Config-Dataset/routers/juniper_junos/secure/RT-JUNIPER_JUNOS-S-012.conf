/* GAACA Dataset — Juniper Junos — SECURE — Sample 12 */
system {
    host-name DIST-MXSERIES-AMS-63;
    root-authentication {
        encrypted-password "REDACTED_ADMIN_PASS";
    }
    services {
        ssh {
            protocol-version v2;
            ciphers [ aes256-gcm@openssh.com aes256-ctr ];
            macs [ hmac-sha2-512 hmac-sha2-256 ];
            connection-limit 5;
            rate-limit 3;
        }
    }
    login {
        user netops {
            uid 2001;
            class super-user;
            authentication {
                encrypted-password "REDACTED_ADMIN_PASS";
            }
        }
    }
    syslog {
        user * {
            any emergency;
        }
        host 198.51.100.11 {
            any notice;
            authorization info;
        }
        file messages {
            any notice;
            authorization info;
        }
    }
    ntp {
        server 198.51.100.123;
    }
}
interfaces {
    ge-0/0/0 {
        unit 0 {
            description "WAN Uplink";
            family inet {
                rpf-check {
                    mode strict;
                }
                address 203.0.113.8/30;
            }
        }
    }
    fxp0 {
        unit 0 {
            family inet {
                address 192.0.2.89/24;
            }
        }
    }
}
routing-options {
    autonomous-system 64765;
}
protocols {
    bgp {
        group EXTERNAL-PEERS {
            type external;
            neighbor 192.0.2.203 {
                peer-as 64715;
                authentication-key "REDACTED_ADMIN_PASS";
            }
        }
    }
    lldp {
        disable;
    }
}
