interface GigabitEthernet 0/0
 description WAN-OUT
 ip address 192.0.2.46 255.255.255.252
 no ip proxy-arp
 no shutdown
!
interface GigabitEthernet 0/1
 ip address 192.0.2.77 255.255.255.0
 no shutdown
!
router bgp 64715
 neighbor 203.0.113.127 remote-as 65334
 neighbor 192.0.2.171 password P@ssw0rd_PLACEHOLDER
!
logging server 198.51.100.10
ntp server 192.0.2.123
!
line vty 0 4
 login local
 transport input ssh
 exec-timeout 10 0
!
end
