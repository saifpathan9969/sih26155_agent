! GAACA Dataset — Ruijie RGOS — SECURE — Sample 18
hostname CAMPUS-RSRSERIESCOREROUTER-TKY-50
service password-encryption
no enable password
enable secret P@ssw0rd_PLACEHOLDER
username admin privilege 15 secret P@ssw0rd_PLACEHOLDER
