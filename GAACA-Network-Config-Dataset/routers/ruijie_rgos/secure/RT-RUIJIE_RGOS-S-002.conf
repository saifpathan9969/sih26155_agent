! GAACA Dataset — Ruijie RGOS — SECURE — Sample 2
hostname PROD-RSRSERIESCOREROUTER-BER-64
service password-encryption
no enable password
enable secret REDACTED_ADMIN_PASS
username admin privilege 15 secret REDACTED_ADMIN_PASS
!
no telnet-server enable
ssh-server enable
ssh-server authentication-retries 3
ssh-server timeout 60
!
interface GigabitEthernet 0/0
 description WAN-OUT
 ip address 203.0.113.40 255.255.255.252
 no ip proxy-arp
 no shutdown
!
interface GigabitEthernet 0/1
 ip address 203.0.113.78 255.255.255.0
 no shutdown
!
router bgp 65089
 neighbor 192.0.2.152 remote-as 65226
 neighbor 198.51.100.203 password REDACTED_ADMIN_PASS
!
logging server 198.51.100.10
ntp server 203.0.113.123
!
line vty 0 4
 login local
 transport input ssh
 exec-timeout 10 0
!
end
