! GAACA Dataset — Ruijie RGOS — SECURE — Sample 11
hostname ACCESS-RSRSERIESCOREROUTER-LON-62
service password-encryption
no enable password
enable secret P@ssw0rd_PLACEHOLDER
username admin privilege 15 secret P@ssw0rd_PLACEHOLDER
!
no telnet-server enable
ssh-server enable
ssh-server authentication-retries 3
ssh-server timeout 60
!
interface GigabitEthernet 0/0
 description WAN-OUT
 ip address 192.0.2.145 255.255.255.252
 no ip proxy-arp
 no shutdown
!
interface GigabitEthernet 0/1
 ip address 203.0.113.169 255.255.255.0
 no shutdown
!
router bgp 65201
 neighbor 192.0.2.50 remote-as 65525
 neighbor 198.51.100.209 password P@ssw0rd_PLACEHOLDER
!
logging server 203.0.113.50
ntp server 192.0.2.123
!
line vty 0 4
 login local
 transport input ssh
 exec-timeout 10 0
!
end
