! GAACA Dataset — Ruijie RGOS — SECURE — Sample 14
hostname BR-RSRSERIESCOREROUTER-DAL-71
service password-encryption
no enable password
enable secret REDACTED_ADMIN_PASS
username admin privilege 15 secret REDACTED_ADMIN_PASS
!
no telnet-server enable
ssh-server enable
ssh-server authentication-retries 3
ssh-server timeout 60
!
interface GigabitEthernet 0/0
 description WAN-OUT
 ip address 203.0.113.200 255.255.255.252
 no ip proxy-arp
 no shutdown
!
interface GigabitEthernet 0/1
 ip address 203.0.113.150 255.255.255.0
 no shutdown
!
router bgp 65188
 neighbor 198.51.100.98 remote-as 65151
 neighbor 203.0.113.17 password REDACTED_ADMIN_PASS
!
logging server 198.51.100.11
ntp server 198.51.100.123
!
line vty 0 4
 login local
 transport input ssh
 exec-timeout 10 0
!
end
