! GAACA Dataset — Ruijie RGOS — SECURE — Sample 20
hostname CAMPUS-RSRSERIESCOREROUTER-AMS-11
service password-encryption
no enable password
enable secret P@ssw0rd_PLACEHOLDER
username admin privilege 15 secret P@ssw0rd_PLACEHOLDER
!
no telnet-server enable
ssh-server enable
ssh-server authentication-retries 3
ssh-server timeout 60
!
interface GigabitEthernet 0/0
 description WAN-OUT
 ip address 203.0.113.65 255.255.255.252
 no ip proxy-arp
 no shutdown
!
interface GigabitEthernet 0/1
 ip address 192.0.2.230 255.255.255.0
 no shutdown
!
router bgp 65475
 neighbor 203.0.113.238 remote-as 64977
 neighbor 198.51.100.242 password P@ssw0rd_PLACEHOLDER
!
logging server 203.0.113.50
ntp server 192.0.2.123
!
line vty 0 4
 login local
 transport input ssh
 exec-timeout 10 0
!
end
