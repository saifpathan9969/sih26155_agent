! GAACA Dataset — Ruijie RGOS — SECURE — Sample 13
hostname DIST-RSRSERIESCOREROUTER-SYD-80
service password-encryption
no enable password
enable secret T3st_P@ssw0rd_Lab!
username admin privilege 15 secret T3st_P@ssw0rd_Lab!
!
no telnet-server enable
ssh-server enable
ssh-server authentication-retries 3
ssh-server timeout 60
!
interface GigabitEthernet 0/0
 description WAN-OUT
 ip address 192.0.2.28 255.255.255.252
 no ip proxy-arp
 no shutdown
!
interface GigabitEthernet 0/1
 ip address 203.0.113.239 255.255.255.0
 no shutdown
!
router bgp 64653
 neighbor 192.0.2.227 remote-as 65513
 neighbor 192.0.2.242 password T3st_P@ssw0rd_Lab!
!
logging server 198.51.100.11
ntp server 192.0.2.123
!
line vty 0 4
 login local
 transport input ssh
 exec-timeout 10 0
!
end
