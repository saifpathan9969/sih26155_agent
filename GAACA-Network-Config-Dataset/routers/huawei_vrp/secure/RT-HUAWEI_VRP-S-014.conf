# GAACA Dataset — Huawei VRP — SECURE — Sample 14
sysname BR-NETENGINE/ARROUTER-DAL-71
#
undo info-center enable
info-center enable
info-center loghost 198.51.100.11
#
undo telnet server enable
stelnet server enable
ssh server cipher aes256_gcm
ssh server key-exchange dh_group14_sha256
ssh user admin authentication-type password
ssh user admin service-type stelnet
#
aaa
 local-user admin password irreversible-cipher REDACTED_ADMIN_PASS
 local-user admin service-type stelnet
 local-user admin level 15
#
interface GigabitEthernet0/0/0
 description WAN-UPLINK
 ip address 203.0.113.200 255.255.255.252
 urpf strict
#
interface GigabitEthernet0/0/1
 ip address 203.0.113.150 255.255.255.0
#
bgp 65188
 router-id 198.51.100.98
 peer 203.0.113.139 as-number 64579
 peer 198.51.100.164 password cipher REDACTED_ADMIN_PASS
#
snmp-agent
snmp-agent sys-info version v3
snmp-agent group v3 SECGROUP privacy
snmp-agent usm-user v3 secuser group SECGROUP
#
ntp-service authentication enable
ntp-service unicast-server 198.51.100.123
#
user-interface vty 0 4
 authentication-mode aaa
 user navigation level 15
 idle-timeout 5 0
 protocol inbound ssh
#
return
