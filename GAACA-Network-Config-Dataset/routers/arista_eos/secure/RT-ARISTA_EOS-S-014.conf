! GAACA Dataset — Arista EOS — SECURE — Sample 14
!
transceiver qsfp default-mode 4x10G
!
hostname BR-7280R/7500RROUTER-DAL-71
ip domain-name corp.internal
!
service password-encryption
!
management ssh
   protocol-version 2
   cipher aes256-gcm
   idle-timeout 10
   no shutdown
!
no management api http-commands
management api http-commands
   no shutdown
   protocol https
   protocol http shutdown
!
username admin privilege 15 role network-admin secret sha512 REDACTED_ADMIN_PASS
!
vrf instance MGMT
!
interface Management1
   vrf MGMT
   ip address 203.0.113.200/24
!
interface Ethernet1
   description WAN-PEERING
   no switchport
   ip address 203.0.113.150/30
!
router bgp 65188
   router-id 198.51.100.98
   neighbor 203.0.113.139 remote-as 64579
   neighbor 198.51.100.164 password 7 REDACTED_ADMIN_PASS
!
logging host 198.51.100.11 vrf MGMT
ntp server vrf MGMT 198.51.100.123 prefer
!
banner login
Authorized Access Only! All activity logged.
EOF
!
