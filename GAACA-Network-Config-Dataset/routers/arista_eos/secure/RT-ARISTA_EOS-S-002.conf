! GAACA Dataset — Arista EOS — SECURE — Sample 2
!
transceiver qsfp default-mode 4x10G
!
hostname PROD-7280R/7500RROUTER-BER-64
ip domain-name corp.internal
!
service password-encryption
!
management ssh
   protocol-version 2
   cipher aes256-gcm
   idle-timeout 10
   no shutdown
!
no management api http-commands
management api http-commands
   no shutdown
   protocol https
   protocol http shutdown
!
username admin privilege 15 role network-admin secret sha512 REDACTED_ADMIN_PASS
!
vrf instance MGMT
!
interface Management1
   vrf MGMT
   ip address 203.0.113.40/24
!
interface Ethernet1
   description WAN-PEERING
   no switchport
   ip address 203.0.113.78/30
!
router bgp 65089
   router-id 192.0.2.152
   neighbor 203.0.113.66 remote-as 65323
   neighbor 198.51.100.187 password 7 REDACTED_ADMIN_PASS
!
logging host 198.51.100.10 vrf MGMT
ntp server vrf MGMT 203.0.113.123 prefer
!
banner login
Authorized Access Only! All activity logged.
EOF
!
