# GAACA Dataset — Extreme EXOS — SECURE — Sample 14
configure snmp sysName "BR-SUMMIT/SLXROUTER-DAL-71"
disable telnet
enable ssh2
configure ssh2 key 4096
disable web
configure account admin encrypted "REDACTED_ADMIN_PASS"
configure syslog add 198.51.100.11:514 vr VR-Mgmt local0 notice
configure sntp-client add server 198.51.100.123 vr VR-Mgmt
enable sntp-client
configure vlan default delete ports all
create vlan "WAN-VLAN"
configure vlan "WAN-VLAN" tag 2491
configure vlan "WAN-VLAN" add ports 1:1 untagged
configure vlan "WAN-VLAN" ipaddress 203.0.113.150/30
enable ipforwarding vlan "WAN-VLAN"
configure rip disable
configure ospf add vlan "WAN-VLAN" area 0.0.0.0
enable ospf
