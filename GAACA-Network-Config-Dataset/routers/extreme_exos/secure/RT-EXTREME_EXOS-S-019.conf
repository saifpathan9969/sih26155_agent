# GAACA Dataset — Extreme EXOS — SECURE — Sample 19
configure snmp sysName "PROD-SUMMIT/SLXROUTER-MUM-15"
disable telnet
enable ssh2
configure ssh2 key 4096
disable web
configure account admin encrypted "P@ssw0rd_PLACEHOLDER"
configure syslog add 198.51.100.11:514 vr VR-Mgmt local0 notice
configure sntp-client add server 203.0.113.123 vr VR-Mgmt
enable sntp-client
configure vlan default delete ports all
create vlan "WAN-VLAN"
configure vlan "WAN-VLAN" tag 2201
configure vlan "WAN-VLAN" add ports 1:1 untagged
configure vlan "WAN-VLAN" ipaddress 192.0.2.249/30
enable ipforwarding vlan "WAN-VLAN"
configure rip disable
configure ospf add vlan "WAN-VLAN" area 0.0.0.0
enable ospf
