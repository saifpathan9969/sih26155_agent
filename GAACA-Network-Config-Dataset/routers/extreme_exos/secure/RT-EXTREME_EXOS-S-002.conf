# GAACA Dataset — Extreme EXOS — SECURE — Sample 2
configure snmp sysName "PROD-SUMMIT/SLXROUTER-BER-64"
disable telnet
enable ssh2
configure ssh2 key 4096
disable web
configure account admin encrypted "REDACTED_ADMIN_PASS"
configure syslog add 198.51.100.10:514 vr VR-Mgmt local0 notice
configure sntp-client add server 203.0.113.123 vr VR-Mgmt
enable sntp-client
configure vlan default delete ports all
create vlan "WAN-VLAN"
configure vlan "WAN-VLAN" tag 2912
configure vlan "WAN-VLAN" add ports 1:1 untagged
configure vlan "WAN-VLAN" ipaddress 192.0.2.193/30
enable ipforwarding vlan "WAN-VLAN"
configure rip disable
configure ospf add vlan "WAN-VLAN" area 0.0.0.0
enable ospf
