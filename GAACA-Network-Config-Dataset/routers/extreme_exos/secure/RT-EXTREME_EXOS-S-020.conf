# GAACA Dataset — Extreme EXOS — SECURE — Sample 20
configure snmp sysName "CAMPUS-SUMMIT/SLXROUTER-AMS-11"
disable telnet
enable ssh2
configure ssh2 key 4096
disable web
configure account admin encrypted "P@ssw0rd_PLACEHOLDER"
configure syslog add 203.0.113.50:514 vr VR-Mgmt local0 notice
configure sntp-client add server 192.0.2.123 vr VR-Mgmt
enable sntp-client
configure vlan default delete ports all
create vlan "WAN-VLAN"
configure vlan "WAN-VLAN" tag 2784
configure vlan "WAN-VLAN" add ports 1:1 untagged
configure vlan "WAN-VLAN" ipaddress 198.51.100.14/30
enable ipforwarding vlan "WAN-VLAN"
configure rip disable
configure ospf add vlan "WAN-VLAN" area 0.0.0.0
enable ospf
