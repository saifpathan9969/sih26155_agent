# GAACA Dataset — Extreme EXOS — SECURE — Sample 4
configure snmp sysName "CORE-SUMMIT/SLXROUTER-DAL-18"
disable telnet
enable ssh2
configure ssh2 key 4096
disable web
configure account admin encrypted "P@ssw0rd_PLACEHOLDER"
configure syslog add 198.51.100.10:514 vr VR-Mgmt local0 notice
configure sntp-client add server 198.51.100.123 vr VR-Mgmt
enable sntp-client
configure vlan default delete ports all
create vlan "WAN-VLAN"
configure vlan "WAN-VLAN" tag 1876
configure vlan "WAN-VLAN" add ports 1:1 untagged
configure vlan "WAN-VLAN" ipaddress 198.51.100.197/30
enable ipforwarding vlan "WAN-VLAN"
configure rip disable
configure ospf add vlan "WAN-VLAN" area 0.0.0.0
enable ospf
