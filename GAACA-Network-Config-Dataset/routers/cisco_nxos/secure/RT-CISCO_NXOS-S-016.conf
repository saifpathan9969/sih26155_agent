! GAACA Dataset — Cisco NX-OS — SECURE — Sample 16
version 10.3(1)
hostname WAN-NEXUS9000ROUTER-SFO-21
!
feature ssh
feature bgp
feature ospf
feature interface-vlan
feature tacacs+
!
no feature telnet
no feature http-server
!
service password-encryption
ssh key rsa 4096 force
ssh server key-exchange dh-group14-sha256,ecdh-sha2-nistp384
ssh server ciphers aes256-gcm,aes128-gcm
!
username admin role network-admin password 5 P@ssw0rd_PLACEHOLDER
!
vrf context management
 ip route 0.0.0.0/0 203.0.113.73
!
interface mgmt0
 vrf member management
 ip address 198.51.100.161/24
 no shutdown
!
interface Ethernet1/1
 description WAN-ROUTER-LINK
 no switchport
 ip address 192.0.2.24/30
 no ip redirects
 no ip directed-broadcast
 no shutdown
!
router bgp 65242
 router-id 198.51.100.14
 address-family ipv4 unicast
 neighbor 203.0.113.210 remote-as 64959
   password 7 P@ssw0rd_PLACEHOLDER
   address-family ipv4 unicast
!
logging server 198.51.100.10 6 use-vrf management
logging level bgp 5
logging level ospf 5
!
ntp server 203.0.113.123 use-vrf management prefer
!
line console
 exec-timeout 10
line vty
 exec-timeout 10
!
