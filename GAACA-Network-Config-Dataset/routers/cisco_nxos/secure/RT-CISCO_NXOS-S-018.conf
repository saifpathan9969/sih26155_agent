! GAACA Dataset — Cisco NX-OS — SECURE — Sample 18
version 10.3(1)
hostname CAMPUS-NEXUS9000ROUTER-TKY-50
!
feature ssh
feature bgp
feature ospf
feature interface-vlan
feature tacacs+
!
no feature telnet
no feature http-server
!
service password-encryption
ssh key rsa 4096 force
ssh server key-exchange dh-group14-sha256,ecdh-sha2-nistp384
ssh server ciphers aes256-gcm,aes128-gcm
!
username admin role network-admin password 5 P@ssw0rd_PLACEHOLDER
!
vrf context management
 ip route 0.0.0.0/0 192.0.2.46
!
interface mgmt0
 vrf member management
 ip address 192.0.2.77/24
 no shutdown
!
interface Ethernet1/1
 description WAN-ROUTER-LINK
 no switchport
 ip address 192.0.2.157/30
 no ip redirects
 no ip directed-broadcast
 no shutdown
!
router bgp 65017
 router-id 192.0.2.171
 address-family ipv4 unicast
 neighbor 192.0.2.176 remote-as 65123
   password 7 P@ssw0rd_PLACEHOLDER
   address-family ipv4 unicast
!
logging server 198.51.100.10 6 use-vrf management
logging level bgp 5
logging level ospf 5
!
ntp server 192.0.2.123 use-vrf management prefer
!
line console
 exec-timeout 10
line vty
 exec-timeout 10
!
