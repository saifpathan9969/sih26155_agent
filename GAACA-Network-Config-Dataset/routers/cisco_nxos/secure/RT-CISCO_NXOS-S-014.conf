! GAACA Dataset — Cisco NX-OS — SECURE — Sample 14
version 10.3(1)
hostname BR-NEXUS9000ROUTER-DAL-71
!
feature ssh
feature bgp
feature ospf
feature interface-vlan
feature tacacs+
!
no feature telnet
no feature http-server
!
service password-encryption
ssh key rsa 4096 force
ssh server key-exchange dh-group14-sha256,ecdh-sha2-nistp384
ssh server ciphers aes256-gcm,aes128-gcm
!
username admin role network-admin password 5 REDACTED_ADMIN_PASS
!
vrf context management
 ip route 0.0.0.0/0 203.0.113.200
!
interface mgmt0
 vrf member management
 ip address 203.0.113.150/24
 no shutdown
!
interface Ethernet1/1
 description WAN-ROUTER-LINK
 no switchport
 ip address 203.0.113.109/30
 no ip redirects
 no ip directed-broadcast
 no shutdown
!
router bgp 64903
 router-id 203.0.113.139
 address-family ipv4 unicast
 neighbor 192.0.2.99 remote-as 65167
   password 7 REDACTED_ADMIN_PASS
   address-family ipv4 unicast
!
logging server 198.51.100.11 6 use-vrf management
logging level bgp 5
logging level ospf 5
!
ntp server 198.51.100.123 use-vrf management prefer
!
line console
 exec-timeout 10
line vty
 exec-timeout 10
!
