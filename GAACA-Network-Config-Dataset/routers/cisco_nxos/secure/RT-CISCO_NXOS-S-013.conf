! GAACA Dataset — Cisco NX-OS — SECURE — Sample 13
version 10.3(1)
hostname DIST-NEXUS9000ROUTER-SYD-80
!
feature ssh
feature bgp
feature ospf
feature interface-vlan
feature tacacs+
!
no feature telnet
no feature http-server
!
service password-encryption
ssh key rsa 4096 force
ssh server key-exchange dh-group14-sha256,ecdh-sha2-nistp384
ssh server ciphers aes256-gcm,aes128-gcm
!
username admin role network-admin password 5 T3st_P@ssw0rd_Lab!
!
vrf context management
 ip route 0.0.0.0/0 192.0.2.28
!
interface mgmt0
 vrf member management
 ip address 203.0.113.239/24
 no shutdown
!
interface Ethernet1/1
 description WAN-ROUTER-LINK
 no switchport
 ip address 192.0.2.197/30
 no ip redirects
 no ip directed-broadcast
 no shutdown
!
router bgp 65336
 router-id 192.0.2.227
 address-family ipv4 unicast
 neighbor 192.0.2.242 remote-as 64532
   password 7 T3st_P@ssw0rd_Lab!
   address-family ipv4 unicast
!
logging server 198.51.100.11 6 use-vrf management
logging level bgp 5
logging level ospf 5
!
ntp server 192.0.2.123 use-vrf management prefer
!
line console
 exec-timeout 10
line vty
 exec-timeout 10
!
