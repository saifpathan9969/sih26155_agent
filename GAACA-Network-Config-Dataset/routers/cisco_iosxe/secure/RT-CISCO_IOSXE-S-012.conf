! GAACA Dataset — Cisco IOS-XE — SECURE — Sample 12
version 17.9
service timestamps debug datetime msec localtime show-timezone
service timestamps log datetime msec localtime show-timezone
service password-encryption
service call-home
platform punt-keepalive disable-kernel-core
!
hostname DIST-CATALYST8000/ISR4000-AMS-63
!
vrf definition Mgmt-intf
 address-family ipv4
 exit-address-family
!
aaa new-model
aaa group server radius RADIUS-GROUP
 server name RAD-1
!
radius server RAD-1
 address ipv4 198.51.100.20 auth-port 1812 acct-port 1813
 key REDACTED_PSK_0123456789abcdef
!
aaa authentication login default group RADIUS-GROUP local
aaa authorization exec default group RADIUS-GROUP local
aaa accounting exec default start-stop group RADIUS-GROUP
!
ip domain name enterprise.net
ip ssh version 2
ip ssh time-out 30
ip ssh authentication-retries 2
ip ssh client algorithm encryption aes256-gcm
ip ssh server algorithm encryption aes256-gcm aes256-ctr
!
no ip http server
ip http secure-server
ip http secure-active-session-modules none
ip http secure-trustpoint CISCO_IDEVID_SUDI
!
username secadmin privilege 15 algorithm-type scrypt secret REDACTED_ADMIN_PASS
enable algorithm-type scrypt secret REDACTED_ADMIN_PASS
!
interface GigabitEthernet0/0/0
 description WAN-Edge
 ip address 198.51.100.64 255.255.255.252
 ip verify unicast source reachable-via rx
 no ip proxy-arp
 no ip redirects
 no ip unreachables
 no shutdown
!
interface GigabitEthernet0
 vrf forwarding Mgmt-intf
 ip address 192.0.2.203 255.255.255.0
 no shutdown
!
router ospfv3 1
 router-id 192.0.2.240
 authentication ipsec spi 1000 sha1 REDACTED_PSK_0123456789abcdef
!
snmp-server group SECGROUP v3 priv read V1DEFAULT access 10
snmp-server user secuser SECGROUP v3 auth sha REDACTED_ADMIN_PASS priv aes 256 REDACTED_ADMIN_PASS
snmp-server host 198.51.100.11 vrf Mgmt-intf version 3 priv secuser
!
logging buffered 128000 informational
logging host 198.51.100.11 vrf Mgmt-intf
!
ntp server vrf Mgmt-intf 198.51.100.123 prefer
ntp authenticate
ntp trusted-key 1
!
line vty 0 4
 exec-timeout 10 0
 transport input ssh
 transport output none
!
end
