# GAACA Dataset — Nokia SR OS — SECURE — Sample 2
configure system name "PROD-7750SERVICEROUTER-BER-64"
configure system security telnet-server shutdown
configure system security ssh server-shutdown no
configure system security ssh ciphers-in aes256-gcm aes128-gcm
configure system security password min-length 14
configure system security user "admin" password "REDACTED_ADMIN_PASS"
configure system security user "admin" access console netconf
configure log syslog 198.51.100.10 facility local6
configure system ntp server 203.0.113.123 prefer
configure router Base
    interface "system"
        address 203.0.113.40/32
        no shutdown
    exit
    interface "to-core"
        port 1/1/1
        address 203.0.113.78/30
        no shutdown
    exit
    autonomous-system 65089
    bgp
        group "CORE-IBGP"
            peer-as 64674
            authentication-key "REDACTED_ADMIN_PASS"
            neighbor 203.0.113.179
            exit
        exit
        no shutdown
    exit
exit
