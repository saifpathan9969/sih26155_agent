# GAACA Dataset — Nokia SR OS — SECURE — Sample 4
configure system name "CORE-7750SERVICEROUTER-DAL-18"
configure system security telnet-server shutdown
configure system security ssh server-shutdown no
configure system security ssh ciphers-in aes256-gcm aes128-gcm
configure system security password min-length 14
configure system security user "admin" password "P@ssw0rd_PLACEHOLDER"
configure system security user "admin" access console netconf
configure log syslog 198.51.100.10 facility local6
configure system ntp server 198.51.100.123 prefer
configure router Base
    interface "system"
        address 198.51.100.82/32
        no shutdown
    exit
    interface "to-core"
        port 1/1/1
        address 198.51.100.49/30
        no shutdown
    exit
    autonomous-system 64585
    bgp
        group "CORE-IBGP"
            peer-as 64709
            authentication-key "P@ssw0rd_PLACEHOLDER"
            neighbor 203.0.113.235
            exit
        exit
        no shutdown
    exit
exit
