# GAACA Dataset — Nokia SR OS — SECURE — Sample 11
configure system name "ACCESS-7750SERVICEROUTER-LON-62"
configure system security telnet-server shutdown
configure system security ssh server-shutdown no
configure system security ssh ciphers-in aes256-gcm aes128-gcm
configure system security password min-length 14
configure system security user "admin" password "P@ssw0rd_PLACEHOLDER"
configure system security user "admin" access console netconf
configure log syslog 203.0.113.50 facility local6
configure system ntp server 192.0.2.123 prefer
configure router Base
    interface "system"
        address 192.0.2.145/32
        no shutdown
    exit
    interface "to-core"
        port 1/1/1
        address 203.0.113.169/30
        no shutdown
    exit
    autonomous-system 65201
    bgp
        group "CORE-IBGP"
            peer-as 64596
            authentication-key "P@ssw0rd_PLACEHOLDER"
            neighbor 192.0.2.254
            exit
        exit
        no shutdown
    exit
exit
