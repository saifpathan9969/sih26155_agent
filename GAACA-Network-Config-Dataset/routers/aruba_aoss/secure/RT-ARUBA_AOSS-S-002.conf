; GAACA Dataset — Aruba AOS-S — SECURE — Sample 2
hostname "PROD-2930F/3810MROUTINGSWITCH-BER-64"
ip routing
no telnet-server
no web-management
web-management ssl
crypto host-cert generate self-signed
ip ssh
ip ssh filetransfer
password manager user-name "admin" sha1 "REDACTED_ADMIN_PASS"
snmp-server community "public" disable
snmpv3 enable
snmpv3 group initial user "secadmin" sec-model ver3
snmpv3 user "secadmin" auth sha "REDACTED_ADMIN_PASS" priv aes "REDACTED_ADMIN_PASS"
logging 198.51.100.10
sntp server priority 1 203.0.113.123
sntp mode unicast
sntp enable
vlan 1
   name "DEFAULT_VLAN"
   untagged 1-24
   ip address 203.0.113.40 255.255.255.0
   exit
router ospf
   enable
   area 0.0.0.0
   exit
