; GAACA Dataset — Aruba AOS-S — SECURE — Sample 4
hostname "CORE-2930F/3810MROUTINGSWITCH-DAL-18"
ip routing
no telnet-server
no web-management
web-management ssl
crypto host-cert generate self-signed
ip ssh
ip ssh filetransfer
password manager user-name "admin" sha1 "P@ssw0rd_PLACEHOLDER"
snmp-server community "public" disable
snmpv3 enable
snmpv3 group initial user "secadmin" sec-model ver3
snmpv3 user "secadmin" auth sha "P@ssw0rd_PLACEHOLDER" priv aes "P@ssw0rd_PLACEHOLDER"
logging 198.51.100.10
sntp server priority 1 198.51.100.123
sntp mode unicast
sntp enable
vlan 1
   name "DEFAULT_VLAN"
   untagged 1-24
   ip address 198.51.100.82 255.255.255.0
   exit
router ospf
   enable
   area 0.0.0.0
   exit
