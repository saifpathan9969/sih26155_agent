! GAACA Dataset — Cisco IOS — SECURE — Sample 13
!
version 15.7
service timestamps debug datetime msec localtime show-timezone
service timestamps log datetime msec localtime show-timezone
service password-encryption
service sequence-numbers
no service dhcp
no service finger
no service pad
no service udp-small-servers
no service tcp-small-servers
!
hostname DIST-IOSROUTER-SYD-80
!
boot-start-marker
boot-end-marker
!
security passwords min-length 12
security authentication failure rate 3 logs
!
aaa new-model
aaa authentication login default group radius local
aaa authentication enable default group radius enable
aaa authorization exec default group radius local
aaa accounting exec default start-stop group radius
aaa accounting commands 15 default start-stop group radius
!
radius server RADIUS-AUTH
 address ipv4 198.51.100.20 auth-port 1812 acct-port 1813
 key REDACTED_PSK_0123456789abcdef
!
ip domain name example.lab
crypto key generate rsa modulus 4096
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
ip ssh server algorithm encryption aes256-gcm aes128-gcm aes256-ctr
ip ssh server algorithm mac hmac-sha2-512 hmac-sha2-256
!
no ip http server
ip http secure-server
ip http secure-ciphersuite high
!
username admin privilege 15 secret T3st_P@ssw0rd_Lab!
enable secret T3st_P@ssw0rd_Lab!
!
interface GigabitEthernet0/0/0
 description WAN-Primary-Uplink
 ip address 203.0.113.239 255.255.255.252
 no ip redirects
 no ip proxy-arp
 no ip unreachables
 no ip directed-broadcast
 ip verify unicast source reachable-via rx
 ip access-group WAN-INGRESS in
 no shutdown
!
interface GigabitEthernet0/0/1
 description LAN-Internal
 ip address 192.0.2.197 255.255.255.0
 no ip redirects
 no ip proxy-arp
 no shutdown
!
router bgp 65437
 bgp log-neighbor-changes
 neighbor 192.0.2.227 remote-as 65513
 neighbor 192.0.2.242 password REDACTED_PSK_0123456789abcdef
 neighbor 192.0.2.107 prefix-list BGP-IN in
 neighbor 198.51.100.93 prefix-list BGP-OUT out
!
ip access-list extended WAN-INGRESS
 permit tcp 203.0.113.174 0.0.0.255 host 198.51.100.214 eq 22
 permit esp any host 203.0.113.154
 permit udp any host 198.51.100.209 eq 500
 permit udp any host 192.0.2.3 eq 4500
 deny ip any any log-input
!
ip access-list standard MGMT-ACL
 permit 198.51.100.32 0.0.0.255
 deny any log
!
ip prefix-list BGP-IN seq 10 permit 192.0.2.0/24
ip prefix-list BGP-IN seq 20 deny 0.0.0.0/0 le 32
!
ip prefix-list BGP-OUT seq 10 permit 198.51.100.0/24
ip prefix-list BGP-OUT seq 20 deny 0.0.0.0/0 le 32
!
logging buffered 64000 informational
logging host 198.51.100.11 transport udp port 514
logging source-interface GigabitEthernet0/0/1
!
snmp-server group SNMPv3Group v3 priv
snmp-server user snmpv3user SNMPv3Group v3 auth sha T3st_P@ssw0rd_Lab! priv aes 256 T3st_P@ssw0rd_Lab!
snmp-server host 198.51.100.11 version 3 priv snmpv3user
no snmp-server community public
no snmp-server community private
!
ntp authenticate
ntp authentication-key 1 md5 REDACTED_PSK_0123456789abcdef
ntp trusted-key 1
ntp server 192.0.2.123 key 1 prefer
!
banner motd ^C
UNAUTHORIZED ACCESS TO THIS DEVICE IS STRICTLY PROHIBITED.
ALL SESSIONS ARE MONITORED, LOGGED, AND AUDITED.
^C
!
line con 0
 exec-timeout 5 0
 login authentication default
 transport output none
line aux 0
 no exec
 transport input none
line vty 0 4
 exec-timeout 5 0
 access-class MGMT-ACL in
 login authentication default
 transport input ssh
 transport output none
!
end
