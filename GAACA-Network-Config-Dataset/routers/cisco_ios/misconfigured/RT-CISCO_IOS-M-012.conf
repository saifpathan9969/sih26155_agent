! GAACA Dataset — Cisco IOS — MISCONFIGURED — Sample 12
!
version 15.1
service timestamps debug uptime
service timestamps log uptime
no service password-encryption
!
hostname DMZ-IOSROUTER-NYC-20
!
enable password cisco
enable secret cisco
username admin privilege 15 password admin
!
interface GigabitEthernet0/0/0
 ip address 198.51.100.236 255.255.255.0
 ip redirects
 ip proxy-arp
 no shutdown
!
interface GigabitEthernet0/0/1
 ip address 192.0.2.253 255.255.255.0
 no shutdown
!
router bgp 64708
 neighbor 192.0.2.168 remote-as 65185
!
ip http server
no ip http secure-server
!
snmp-server community public RW
snmp-server community private RW
snmp-server host 203.0.113.97 public
!
no logging buffered
no logging console
!
no ntp server
!
line con 0
 password cisco
 login
line vty 0 4
 password cisco
 login
 transport input telnet
!
end
