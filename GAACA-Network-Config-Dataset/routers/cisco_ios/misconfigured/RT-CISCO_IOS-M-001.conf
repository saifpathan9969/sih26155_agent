! GAACA Dataset — Cisco IOS — MISCONFIGURED — Sample 1
!
version 15.1
service timestamps debug uptime
service timestamps log uptime
no service password-encryption
!
hostname WAN-IOSROUTER-DXB-09
!
enable password cisco
enable secret cisco
username admin privilege 15 password admin
!
interface GigabitEthernet0/0/0
 ip address 192.0.2.252 255.255.255.0
 ip redirects
 ip proxy-arp
 no shutdown
!
interface GigabitEthernet0/0/1
 ip address 192.0.2.102 255.255.255.0
 no shutdown
!
router bgp 64806
 neighbor 192.0.2.10 remote-as 64924
!
ip http server
no ip http secure-server
!
snmp-server community public RW
snmp-server community private RW
snmp-server host 192.0.2.45 public
!
no logging buffered
no logging console
!
no ntp server
!
line con 0
 password cisco
 login
line vty 0 4
 password cisco
 login
 transport input telnet
!
end
