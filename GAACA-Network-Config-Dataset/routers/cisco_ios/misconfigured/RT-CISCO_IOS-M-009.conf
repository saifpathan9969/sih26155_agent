! GAACA Dataset — Cisco IOS — MISCONFIGURED — Sample 9
!
version 15.1
service timestamps debug uptime
service timestamps log uptime
no service password-encryption
!
hostname DIST-IOSROUTER-PAR-74
!
enable password cisco
enable secret cisco
username admin privilege 15 password admin
!
interface GigabitEthernet0/0/0
 ip address 203.0.113.223 255.255.255.0
 ip redirects
 ip proxy-arp
 no shutdown
!
interface GigabitEthernet0/0/1
 ip address 203.0.113.29 255.255.255.0
 no shutdown
!
router bgp 64883
 neighbor 192.0.2.114 remote-as 64996
!
ip http server
no ip http secure-server
!
snmp-server community public RW
snmp-server community private RW
snmp-server host 198.51.100.208 public
!
no logging buffered
no logging console
!
no ntp server
!
line con 0
 password cisco
 login
line vty 0 4
 password cisco
 login
 transport input telnet
!
end
