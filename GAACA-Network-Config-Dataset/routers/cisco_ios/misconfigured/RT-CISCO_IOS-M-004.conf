! GAACA Dataset — Cisco IOS — MISCONFIGURED — Sample 4
!
version 15.1
service timestamps debug uptime
service timestamps log uptime
no service password-encryption
!
hostname HQ-IOSROUTER-SEA-55
!
enable password cisco
enable secret cisco
username admin privilege 15 password admin
!
interface GigabitEthernet0/0/0
 ip address 198.51.100.39 255.255.255.0
 ip redirects
 ip proxy-arp
 no shutdown
!
interface GigabitEthernet0/0/1
 ip address 192.0.2.19 255.255.255.0
 no shutdown
!
router bgp 64531
 neighbor 198.51.100.170 remote-as 65165
!
ip http server
no ip http secure-server
!
snmp-server community public RW
snmp-server community private RW
snmp-server host 192.0.2.146 public
!
no logging buffered
no logging console
!
no ntp server
!
line con 0
 password cisco
 login
line vty 0 4
 password cisco
 login
 transport input telnet
!
end
