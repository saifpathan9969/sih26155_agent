! GAACA Dataset — Cisco IOS — MISCONFIGURED — Sample 6
!
version 15.1
service timestamps debug uptime
service timestamps log uptime
no service password-encryption
!
hostname DC-IOSROUTER-FRA-11
!
enable password cisco
enable secret cisco
username admin privilege 15 password admin
!
interface GigabitEthernet0/0/0
 ip address 198.51.100.225 255.255.255.0
 ip redirects
 ip proxy-arp
 no shutdown
!
interface GigabitEthernet0/0/1
 ip address 198.51.100.182 255.255.255.0
 no shutdown
!
router bgp 64768
 neighbor 192.0.2.174 remote-as 64948
!
ip http server
no ip http secure-server
!
snmp-server community public RW
snmp-server community private RW
snmp-server host 203.0.113.91 public
!
no logging buffered
no logging console
!
no ntp server
!
line con 0
 password cisco
 login
line vty 0 4
 password cisco
 login
 transport input telnet
!
end
