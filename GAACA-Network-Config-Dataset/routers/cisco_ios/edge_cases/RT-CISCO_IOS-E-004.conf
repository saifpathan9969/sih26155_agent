! GAACA Dataset — Cisco IOS — EDGE CASE — Sample 4
! Partial configuration with mixed old-style ACL and missing routing block
hostname WAN-IOSROUTER-LON-65
ip domain name old.lab
!
access-list 1 permit any
access-list 100 permit ip any any
!
interface FastEthernet0/0
 ip address 203.0.113.177 255.255.255.0
 ip access-group 100 in
!
router rip
 version 1
 network 192.0.2.0
!
line vty 0 4
 access-class 1 in
 transport input all
!
end
