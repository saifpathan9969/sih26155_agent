# GAACA Dataset — Teltonika RutOS — SECURE — Sample 9
package system
config system
    option hostname 'BR-RUTX09/RUT240CELLULARROUTER-SYD-41'
    option timezone 'UTC'

package dropbear
config dropbear
    option Port '22'
    option PasswordAuth 'off'
    option RootPasswordAuth 'off'

package uhttpd
config uhttpd main
    list listen_https '0.0.0.0:443'
    option redirect_https '1'

package firewall
config defaults
    option syn_flood '1'
    option input 'DROP'
    option output 'ACCEPT'
    option forward 'DROP'
