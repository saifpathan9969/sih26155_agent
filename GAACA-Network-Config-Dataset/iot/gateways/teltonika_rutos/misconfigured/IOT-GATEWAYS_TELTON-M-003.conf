# GAACA Dataset — Teltonika RutOS — MISCONFIGURED — Sample 3
package dropbear
config dropbear
    option Port '22'
    option PasswordAuth 'on'
    option RootPasswordAuth 'on'

package uhttpd
config uhttpd main
    list listen_http '0.0.0.0:80'
    option redirect_https '0'

package firewall
config defaults
    option input 'ACCEPT'
    option forward 'ACCEPT'
